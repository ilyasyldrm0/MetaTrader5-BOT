[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5bot"
version = "2.0.0"
description = "A testable, backtestable RSI + SMA trading bot for MetaTrader 5"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "ilyasyldrm0" }]
keywords = ["metatrader5", "mt5", "trading", "forex", "rsi", "algotrading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

# pandas/numpy are all that is needed for indicators, backtesting and paper
# trading. The MetaTrader5 package is deliberately NOT a hard dependency: it is
# Windows-only, and everything except live trading works without it.
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
live = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[project.urls]
Homepage = "https://github.com/ilyasyldrm0/MetaTrader5-BOT"
Issues = "https://github.com/ilyasyldrm0/MetaTrader5-BOT/issues"

[project.scripts]
mt5bot = "mt5bot.cli:main"

[tool.setuptools.packages.find]
include = ["mt5bot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# The READMEs quote the original 2023 code verbatim, alignment included.
# Reformatting those blocks would misrepresent what the bug actually looked
# like, which is the one thing those snippets exist to show.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH", "RET"]
ignore = [
    "RUF001", # ambiguous unicode in strings (we use × and ≤ in docs/messages)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
# Deliberately no python_version pin. mypy would then analyse the *installed*
# stubs under a language version they were not written for: numpy's stubs use
# 3.12 `type` statements, so pinning 3.11 made mypy reject numpy's own syntax
# on a 3.13 runner. Letting it follow the interpreter is correct, and the
# floor is already stated by requires-python and ruff's target-version.
strict = true
warn_unreachable = true
# The MetaTrader5 package ships no type stubs and cannot even be installed on
# the CI runner, so its adapter is checked against an untyped import.
[[tool.mypy.overrides]]
module = ["MetaTrader5.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
