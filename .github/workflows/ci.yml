name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The MetaTrader5 package is Windows-only and is intentionally not
      # installed here. Everything below runs against the broker abstraction,
      # which is exactly the point of having one.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy mt5bot

      - name: Test
        run: pytest --cov=mt5bot --cov-report=term-missing

      - name: Smoke test the CLI
        run: |
          python main.py --help
          python main.py backtest --csv tests/data/eurusd_m15_sample.csv
